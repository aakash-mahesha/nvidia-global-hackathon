# ============================================================================
# mosquitto.conf — the event bus broker for the eVTOL rig.
#
# The bus is the API (docs/CONTRACTS.md §3): the rig, the console, the Cosmos
# monitor and the permit reasoner talk ONLY through the five JSON topics.
# This file is committed so all four developers run an identical broker
# instead of whatever each machine happens to have lying around.
#
# Run it:
#     mosquitto -c infra/mosquitto.conf -v
#
# Verify it (two terminals):
#     mosquitto_sub -h 127.0.0.1 -t '/rig/#' -v
#     mosquitto_pub -h 127.0.0.1 -t '/rig/state' -m '{"ts":1,"joints":[0,0,0]}'
# ============================================================================

# --- Local development ------------------------------------------------------
# Binds to loopback only: nothing outside this machine can reach it.
# Use 127.0.0.1 rather than `localhost` — on macOS `localhost` resolves to the
# IPv6 ::1 first, which will not match an IPv4-only listener.
listener 1883 127.0.0.1

# --- Rig host over Tailscale (uncomment when the rig host exists) -----------
# Bind to the host's Tailscale address so both sites reach the bus by name
# with no port forwarding. Get the address with:  tailscale ip -4
# Prefer this over 0.0.0.0 — it keeps the bus off any café/hotel/lab LAN the
# rig host happens to be on.
#
# listener 1883 100.x.y.z

# --- Authentication ---------------------------------------------------------
# Anonymous is acceptable here ONLY because the bus is reachable exclusively
# over the tailnet. Anyone who can reach port 1883 can command the rig, so if
# the listener is ever opened beyond Tailscale, this must become a password
# file (see `mosquitto_passwd`) before that happens.
#
# Note the safety rule this does NOT replace: the arm does not move unless a
# human at site 1 is physically present with a hand near the E-stop. The bus
# carries commands; only the local warden energises.
allow_anonymous true

# --- Message handling -------------------------------------------------------
# No persistence: the bus carries live telemetry, not durable state. A restart
# should give every subscriber a clean slate rather than replaying stale
# retained messages — which would otherwise show the console a phantom rig.
persistence false

# /rig/state runs at 10-20 Hz and /monitor/verdict at ~25 Hz. If a subscriber
# stalls, drop old messages rather than growing the queue without bound.
max_queued_messages 1000

# --- Logging ----------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Log every connect/disconnect. Noisy, but during integration you want to see
# immediately when the console or the mock drops off the bus.
connection_messages true
