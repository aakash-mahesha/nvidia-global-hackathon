# ============================================================================
# mosquitto.conf — the event bus broker for the eVTOL rig.
#
# The bus is the API (docs/CONTRACTS.md §3): the rig, the console, the Cosmos
# monitor and the permit reasoner talk ONLY through the five JSON topics.
# This file is committed so all four developers run an identical broker
# instead of whatever each machine happens to have lying around.
#
# Run it:
#     mosquitto -c infra/mosquitto.conf -v
#
# Verify it (two terminals):
#     mosquitto_sub -h 127.0.0.1 -t '/rig/#' -v
#     mosquitto_pub -h 127.0.0.1 -t '/rig/state' -m '{"ts":1,"joints":[0,0,0]}'
# ============================================================================

# --- Local development ------------------------------------------------------
# Binds to loopback only: nothing outside this machine can reach it.
# Use 127.0.0.1 rather than `localhost` — on macOS `localhost` resolves to the
# IPv6 ::1 first, which will not match an IPv4-only listener.
listener 1883 127.0.0.1

# --- Reaching the bus from the other site (D-006) ---------------------------
# Do NOT add a second listener on the host's Tailscale address. Two reasons:
#   * mosquitto cannot bind an address that does not exist, so the broker
#     refuses to start any time Tailscale happens to be down — turning a
#     networking hiccup into "the bus is gone".
#   * the address is per-machine, so it cannot live in a committed file.
#
# Leave this listener on loopback and let Tailscale proxy the port instead.
# On the rig host, in its own terminal:
#
#     tailscale serve --tcp 1883 tcp://127.0.0.1:1883
#
# Deliberately WITHOUT --bg. Foreground means the exposure dies with the
# terminal, so an unauthenticated broker cannot sit reachable for weeks after
# whoever set it up has forgotten. Inspect and undo with:
#
#     tailscale serve status
#     tailscale serve --tcp 1883 off
#
# What the proxy costs: mosquitto sees every connection as coming from
# 127.0.0.1, so the connection log below cannot tell you WHICH machine
# dropped off. Accepted for now. If integration debugging needs real peer
# addresses, add `include_dir infra/mosquitto.d` with that directory
# gitignored, and let each host drop in its own `listener 1883 100.x.y.z`.

# --- Authentication ---------------------------------------------------------
# Anonymous is acceptable here ONLY because the bus is reachable exclusively
# over the tailnet, and the tailnet holds only invited devices. Anyone who can
# reach port 1883 can publish on any topic.
#
# Two concrete triggers make authentication mandatory, not optional (D-006):
#   * the ESP32 joins over WiFi rather than USB serial — that puts the broker
#     on the site-1 LAN, which is a lab or university network, not a trusted
#     one (see O-016)
#   * a device appears on the tailnet that the team does not control
#
# When either happens, before it happens:
#     mosquitto_passwd -c infra/mosquitto.passwd rig    # gitignore this file
#     allow_anonymous false
#     password_file infra/mosquitto.passwd
# and narrow the Tailscale ACL to the dev machines instead of trusting every
# node on the tailnet. Note this also means credentials in `bus.py`,
# `config.py`, every `.env`, and the CI workflow that starts this broker.
#
# Note the safety rule this does NOT replace: the arm does not move unless a
# human at site 1 is physically present with a hand near the E-stop. The bus
# carries commands; only the local warden energises.
allow_anonymous true

# --- Message handling -------------------------------------------------------
# No persistence: the bus carries live telemetry, not durable state. A restart
# should give every subscriber a clean slate rather than replaying stale
# retained messages — which would otherwise show the console a phantom rig.
persistence false

# /rig/state runs at 10-20 Hz and /monitor/verdict at ~25 Hz. If a subscriber
# stalls, drop old messages rather than growing the queue without bound.
max_queued_messages 1000

# --- Logging ----------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Log every connect/disconnect. Noisy, but during integration you want to see
# immediately when the console or the mock drops off the bus.
connection_messages true
